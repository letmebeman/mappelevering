version: "3.8"

services:
  ikt-portal:
    build: .
    container_name: ikt_portal
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /data/ikt_portal.db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Portainer stack environment variables}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer stack environment variables}
    volumes:
      - ikt_data:/data
    restart: unless-stopped
    networks:
      - appnet
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  ikt_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  appnet:
  monitoring:
